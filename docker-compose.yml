services:
  backend:
    build:
      context: .
      dockerfile: milestone_2/backend/Dockerfile
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5

  frontend:
    build:
      context: milestone_2/frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
