services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: tweets
    ports:
      # exposed so the host-side retraining pipeline (GPU) can reach it
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./milestone_4/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app", "-d", "tweets"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: milestone_4/backend/Dockerfile
    # several identical replicas behind the `api` load balancer; they share
    # Redis, Postgres and the model registry, so they scale horizontally
    deploy:
      replicas: ${BACKEND_REPLICAS:-2}
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://app:app@postgres:5432/tweets
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me}
    volumes:
      # shared model registry: the retraining pipeline writes new versions here
      - ./milestone_4/models:/models
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10

  api:
    image: nginx:1.27-alpine
    ports:
      - "8000:8000"
    volumes:
      - ./milestone_4/lb/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: milestone_2/frontend
    ports:
      - "3000:80"
    volumes:
      - ./milestone_4/lb/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    # the image's own check uses `localhost`, which resolves to IPv6 ::1 in
    # Alpine while nginx listens on IPv4 only, so it never passed
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      api:
        condition: service_healthy

  dashboard:
    build:
      context: milestone_4/dashboard
    ports:
      - "8501:8501"
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/tweets
      BACKEND_URL: http://api:8000
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot: merge LoRA -> ONNX -> INT8 for the retraining pipeline.
  # Not started by `docker compose up`; the pipeline runs it with
  # `docker compose --profile tools run --rm exporter ...`.
  exporter:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: milestone_4/retraining/Dockerfile.export
    volumes:
      - ./milestone_4/models:/models
      - hf_cache:/hf_cache

volumes:
  pgdata:
  hf_cache:
