name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r milestone_2/backend/requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Unit + integration tests
        env:
          MODEL_PATH: ${{ github.workspace }}/milestone_1/baseline_model.pkl
        run: |
          cd milestone_2/backend
          PYTHONPATH=. pytest tests --cov=app --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build and start stack
        run: docker compose up --build -d

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{json .State.Health.Status}}' "$(docker compose ps -q backend)" 2>/dev/null || echo '""')
            if [ "$status" = '"healthy"' ]; then
              echo "backend healthy"
              exit 0
            fi
            sleep 2
          done
          echo "backend never became healthy" >&2
          docker compose logs backend
          exit 1

      - name: Smoke test /api/predict through nginx
        run: |
          curl -sf -X POST http://localhost:3000/api/predict \
            -H "Content-Type: application/json" \
            -d '{"text": "Explosion reported downtown, multiple injuries"}' | tee /dev/stderr | grep -q '"label"'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Playwright
        run: |
          pip install playwright==1.49.1
          playwright install --with-deps chromium

      - name: Run UI end-to-end test
        run: pytest milestone_2/tests/test_ui_e2e.py -m e2e

      - name: Compose logs (on failure)
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
