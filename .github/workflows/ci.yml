name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r milestone_2/backend/requirements-dev.txt
          pip install -r milestone_3/backend/requirements-dev.txt
          pip install -r milestone_4/backend/requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Milestone 2 unit + integration tests
        env:
          MODEL_PATH: ${{ github.workspace }}/training/bertweet_lora_final_fulldata
        run: |
          cd milestone_2/backend
          PYTHONPATH=. pytest tests --cov=app --cov-report=term-missing

      - name: Milestone 3 unit tests
        # The optimized ONNX model isn't built in this job (that needs
        # torch/peft/optimum and a few minutes — see export_onnx.py); the
        # model-dependent tests skip themselves when it's missing. Batcher,
        # cache, and API tests run regardless since they mock the model.
        run: |
          cd milestone_3/backend
          PYTHONPATH=. pytest tests --cov=app --cov-report=term-missing

      - name: Milestone 4 backend tests
        # model, Redis and Postgres are all faked; no ONNX model needed
        run: |
          cd milestone_4/backend
          PYTHONPATH=. pytest tests --cov=app --cov-report=term-missing

      - name: Milestone 4 drift, workload and retraining-logic tests
        # covers the pure logic (triggers, data splits, deploy decision, PSI);
        # the GPU fine-tune itself isn't run in CI
        run: |
          cd milestone_4
          pytest tests

  docker:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build and start stack
        # the backend containers (non-root) seed v1 into this bind mount;
        # --wait blocks until every service, including each backend replica,
        # reports healthy
        run: |
          chmod 777 milestone_4/models
          docker compose up --build -d --wait --wait-timeout 600

      - name: Check every backend replica is serving
        run: |
          test "$(docker compose ps -q backend | wc -l)" -ge 2
          docker compose ps

      - name: Smoke test /api/predict through nginx
        run: |
          curl -sf -X POST http://localhost:3000/api/predict \
            -H "Content-Type: application/json" \
            -d '{"text": "Explosion reported downtown, multiple injuries"}' | tee /dev/stderr | grep -q '"label"'

      - name: Smoke test request logging, feedback and dashboard
        run: |
          request_id=$(curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"text": "Flood waters rising on Main St"}' | python3 -c "import json,sys; print(json.load(sys.stdin)['request_id'])")
          curl -sf -X POST http://localhost:8000/feedback \
            -H "Content-Type: application/json" \
            -d "{\"request_id\": \"$request_id\", \"label\": 1}"
          sleep 3  # request rows are flushed to Postgres in batches every second
          docker compose exec -T postgres psql -U app -d tweets -tAc \
            "SELECT count(*) FROM requests r JOIN feedback f ON f.request_id = r.id" | grep -qx 1
          curl -sf http://localhost:8000/health | tee /dev/stderr | grep -q '"database_connected":true'
          for i in $(seq 1 30); do
            curl -sf http://localhost:8501/_stcore/health && exit 0
            sleep 2
          done
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Playwright
        run: |
          pip install pytest==8.4.2 playwright==1.49.1
          playwright install --with-deps chromium

      - name: Run UI end-to-end test
        run: pytest milestone_2/tests/test_ui_e2e.py -m e2e

      - name: Compose logs (on failure)
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
