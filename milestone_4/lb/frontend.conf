# Replaces milestone_2/frontend/nginx.conf under docker compose: same static
# site, but /api goes through the `api` load balancer, and the name is
# re-resolved every 2 s (a variable in proxy_pass forces that), so the
# frontend never keeps sending to a backend container that has been replaced.

resolver 127.0.0.11 valid=2s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        set $api_upstream http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
}
