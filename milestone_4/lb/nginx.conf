# Load balancer in front of the backend replicas (docker compose service
# `backend`, scaled with BACKEND_REPLICAS). Everything that talks to the API
# directly (workload generator, retraining pipeline, dashboard) goes through
# here on :8000.
#
# `resolve` re-reads Docker's DNS every 2 s, so replicas that are added,
# removed or restarted are picked up without reloading nginx.

resolver 127.0.0.11 valid=2s ipv6=off;

upstream backend_pool {
    zone backend_pool 64k;
    server backend:8000 resolve;
}

server {
    listen 8000;

    location / {
        proxy_pass http://backend_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        # a replica that is restarting is skipped instead of failing the request
        proxy_next_upstream error timeout http_502 http_503;
    }
}
